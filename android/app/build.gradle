plugins { id 'com.android.application' }
android {
    namespace 'local.dailymotion'
    compileSdk 35
    defaultConfig { applicationId 'local.dailymotion'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.2.0' }
    signingConfigs {
        debug {
            // Keep the personal test key inside this project; ordinary CI can use its default debug key.
            def personalKey = file('../../private/signing/personal-debug.keystore')
            if (personalKey.exists()) {
                storeFile personalKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
